spring:
  application:
    name: Seafood_Traceability_System
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seafood_traceability_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"

server:
  port: 8080

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 下划线命名转驼峰命名
    map-underscore-to-camel-case: true
    # 控制台输出 SQL 日志，便于调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键自增
      id-type: auto
